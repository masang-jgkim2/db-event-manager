version: 0.0
os: linux

files:
  - source: /
    destination: /masang/masanggames.co.kr/internal-db-event-manager/releases/staging
    overwrite: true

permissions:
  - object: /masang/masanggames.co.kr/internal-db-event-manager/releases/staging
    owner: www-data
    group: www-data
    type:
      - directory
      - file

hooks:
  BeforeInstall:
    - location: scripts/deploy/before-install.sh
      timeout: 300
      runas: root

  AfterInstall:
    - location: scripts/deploy/after-install.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/deploy/application-start.sh
      timeout: 180
      runas: root

  ValidateService:
    - location: scripts/deploy/validate-service.sh
      timeout: 120
      runas: root
